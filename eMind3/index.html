<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eMind3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e2128;
    --panel: #262a33;
    --border: #3a3f4b;
    --text: #d8dce3;
    --muted: #8b93a3;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    color: var(--text); letter-spacing: 0.3px;
  }
  header .spacer { flex: 1; }
  header button {
    background: #333844; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  header button:hover { background: #3d4351; }
  header .hint { font-size: 11.5px; color: var(--muted); }

  main {
    flex: 1; display: flex; min-height: 0;
  }

  #editorPane {
    width: 34%; min-width: 220px; max-width: 70%;
    resize: horizontal; overflow: auto;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
  }
  #editor {
    flex: 1; width: 100%; height: 100%;
    background: var(--panel); color: var(--text);
    border: none; outline: none; resize: none;
    padding: 14px; font: 13px/1.55 "SF Mono", Menlo, Consolas, monospace;
    tab-size: 2;
  }

  #canvasPane { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  #canvasPane.panning { cursor: grabbing; }
  #canvasPane:not(.panning) { cursor: grab; }
  svg#map { width: 100%; height: 100%; display: block; }

  .node rect { stroke-width: 1.2; cursor: pointer; }
  .node text { font: 13px -apple-system, sans-serif; fill: #0d0f13; cursor: pointer; user-select: none; pointer-events: none; }
  .node.root text { font-weight: 700; font-size: 14.5px; }
  .link { fill: none; stroke-width: 2; opacity: 0.75; }
  .toggle circle { cursor: pointer; }
  .toggle text { font: 11px monospace; fill: #fff; pointer-events: none; user-select: none; }

  #emptyState {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>eMind3</h1>
    <span class="hint">markdown bullet list &rarr; mind map</span>
    <div class="spacer"></div>
    <span class="hint">scroll to zoom &middot; drag to pan &middot; click a node to collapse</span>
    <button id="fitBtn">Fit to screen</button>
    <button id="exportBtn">Export SVG</button>
  </header>
  <main>
    <div id="editorPane">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div id="canvasPane">
      <svg id="map">
        <g id="viewport"></g>
      </svg>
      <div id="emptyState">Type a markdown bullet list on the left to see the mind map.</div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "emind3.source";
  var DEFAULT_SOURCE =
"# eMind3\n" +
"- Getting Started\n" +
"  - Write a markdown bullet list on the left\n" +
"  - Nested bullets become child nodes\n" +
"  - Click any node to collapse or expand it\n" +
"- Features\n" +
"  - Live preview as you type\n" +
"  - Pan and zoom the canvas\n" +
"  - Single HTML file, no dependencies\n" +
"- Tips\n" +
"  - Indent with spaces to create sub-branches\n" +
"  - Use -, * or + as bullet markers\n";

  var editor = document.getElementById("editor");
  var svg = document.getElementById("map");
  var viewport = document.getElementById("viewport");
  var canvasPane = document.getElementById("canvasPane");
  var emptyState = document.getElementById("emptyState");
  var fitBtn = document.getElementById("fitBtn");
  var exportBtn = document.getElementById("exportBtn");

  // ---------- Markdown -> tree ----------

  function parseMarkdown(source) {
    var lines = source.split("\n");
    var titleLine = null;
    var bulletLines = [];

    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      if (raw.trim() === "") continue;
      var leadingMatch = raw.match(/^[\t ]*/)[0];
      var indent = leadingMatch.replace(/\t/g, "    ").length;
      var trimmed = raw.trim();
      var bulletMatch = trimmed.match(/^[-*+]\s+(.*)$/);
      if (bulletMatch) {
        bulletLines.push({ indent: indent, text: bulletMatch[1].trim() });
      } else if (titleLine === null && bulletLines.length === 0) {
        titleLine = trimmed.replace(/^#+\s*/, "");
      }
    }

    var topLevel = [];
    var stack = [{ indent: -1, children: topLevel }];
    for (var j = 0; j < bulletLines.length; j++) {
      var item = bulletLines[j];
      var node = { label: item.text, children: [] };
      while (stack.length > 1 && item.indent <= stack[stack.length - 1].indent) {
        stack.pop();
      }
      stack[stack.length - 1].children.push(node);
      stack.push({ indent: item.indent, children: node.children });
    }

    var root;
    if (titleLine) {
      root = { label: titleLine, children: topLevel };
    } else if (topLevel.length === 1) {
      root = topLevel[0];
    } else if (topLevel.length === 0) {
      return null;
    } else {
      root = { label: "Mind Map", children: topLevel };
    }
    return root;
  }

  // ---------- Layout ----------

  var FONT = "13px -apple-system, sans-serif";
  var ROOT_FONT = "700 14.5px -apple-system, sans-serif";
  var PAD_X = 14, NODE_H = 30, LEAF_PITCH = 42, COL_GAP = 70, MARGIN = 40;

  var measureCanvas = document.createElement("canvas");
  var measureCtx = measureCanvas.getContext("2d");

  function textWidth(text, font) {
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  }

  function assignDepthAndSize(node, depth, maxWidths) {
    node.depth = depth;
    var font = depth === 0 ? ROOT_FONT : FONT;
    node.boxWidth = textWidth(node.label, font) + PAD_X * 2;
    if (maxWidths[depth] === undefined || node.boxWidth > maxWidths[depth]) {
      maxWidths[depth] = node.boxWidth;
    }
    if (!node.collapsed) {
      for (var i = 0; i < node.children.length; i++) {
        assignDepthAndSize(node.children[i], depth + 1, maxWidths);
      }
    }
  }

  function assignX(node, colX) {
    node.x = colX[node.depth];
    if (!node.collapsed) {
      for (var i = 0; i < node.children.length; i++) assignX(node.children[i], colX);
    }
  }

  function assignY(node, counter) {
    if (node.collapsed || node.children.length === 0) {
      node.yIndex = counter.val++;
    } else {
      var lo = Infinity, hi = -Infinity;
      for (var i = 0; i < node.children.length; i++) {
        assignY(node.children[i], counter);
        lo = Math.min(lo, node.children[i].yIndex);
        hi = Math.max(hi, node.children[i].yIndex);
      }
      node.yIndex = (lo + hi) / 2;
    }
  }

  function layout(root) {
    var maxWidths = {};
    assignDepthAndSize(root, 0, maxWidths);

    var colX = {};
    var cum = MARGIN;
    var maxDepth = 0;
    for (var d in maxWidths) if (+d > maxDepth) maxDepth = +d;
    for (var depth = 0; depth <= maxDepth; depth++) {
      colX[depth] = cum;
      cum += (maxWidths[depth] || 0) + COL_GAP;
    }
    assignX(root, colX);

    var counter = { val: 0 };
    assignY(root, counter);

    var allNodes = [];
    (function collect(n) {
      allNodes.push(n);
      if (!n.collapsed) for (var i = 0; i < n.children.length; i++) collect(n.children[i]);
    })(root);

    for (var k = 0; k < allNodes.length; k++) {
      allNodes[k].y = MARGIN + allNodes[k].yIndex * LEAF_PITCH;
    }

    return allNodes;
  }

  // ---------- Rendering ----------

  var PALETTE = [
    "#5b9dff", "#54c98a", "#f0a13c", "#e5678f",
    "#9d7bf0", "#3ec7c7", "#e0c23c", "#f07d5b"
  ];
  var ROOT_COLOR = "#aab2c3";

  function branchHue(node, ancestors) {
    for (var i = ancestors.length - 1; i >= 0; i--) {
      if (ancestors[i].depth === 1) return ancestors[i].branchIndex;
    }
    return -1;
  }

  function assignBranchIndex(root) {
    root.branchIndex = -1;
    for (var i = 0; i < root.children.length; i++) {
      (function walk(n, idx) {
        n.branchIndex = idx;
        for (var c = 0; c < n.children.length; c++) walk(n.children[c], idx);
      })(root.children[i], i % PALETTE.length);
    }
  }

  var svgNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var e = document.createElementNS(svgNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function colorFor(node) {
    if (node.depth === 0) return ROOT_COLOR;
    return PALETTE[node.branchIndex % PALETTE.length];
  }

  var view = { x: 0, y: 0, scale: 1 };

  function updateTransform() {
    viewport.setAttribute("transform",
      "translate(" + view.x + "," + view.y + ") scale(" + view.scale + ")");
  }

  var currentRoot = null;
  var currentNodes = [];

  function render() {
    var source = editor.value;
    var root = parseMarkdown(source);
    currentRoot = root;
    draw();
  }

  function draw() {
    var root = currentRoot;

    while (viewport.firstChild) viewport.removeChild(viewport.firstChild);

    if (!root) {
      currentNodes = [];
      emptyState.style.display = "flex";
      return;
    }
    emptyState.style.display = "none";

    assignBranchIndex(root);
    var nodes = layout(root);
    currentNodes = nodes;

    // links
    var linkLayer = el("g", { class: "links" });
    viewport.appendChild(linkLayer);
    (function drawLinks(node) {
      if (node.collapsed) return;
      for (var i = 0; i < node.children.length; i++) {
        var c = node.children[i];
        var x0 = node.x + node.boxWidth, y0 = node.y + NODE_H / 2;
        var x1 = c.x, y1 = c.y + NODE_H / 2;
        var mx = (x0 + x1) / 2;
        var d = "M" + x0 + "," + y0 + " C" + mx + "," + y0 + " " + mx + "," + y1 + " " + x1 + "," + y1;
        var path = el("path", { class: "link", d: d, stroke: colorFor(c) });
        linkLayer.appendChild(path);
        drawLinks(c);
      }
    })(root);

    // nodes
    var nodeLayer = el("g", { class: "nodes" });
    viewport.appendChild(nodeLayer);
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var g = el("g", { class: "node" + (n.depth === 0 ? " root" : "") });
      var color = colorFor(n);
      var rect = el("rect", {
        x: n.x, y: n.y, width: n.boxWidth, height: NODE_H,
        rx: NODE_H / 2, ry: NODE_H / 2,
        fill: n.depth === 0 ? color : color,
        stroke: color,
        "fill-opacity": n.depth === 0 ? 0.9 : 0.85
      });
      var text = el("text", {
        x: n.x + n.boxWidth / 2, y: n.y + NODE_H / 2 + 4.5,
        "text-anchor": "middle"
      });
      text.textContent = n.label;
      g.appendChild(rect);
      g.appendChild(text);

      if (n.children.length > 0) {
        var cx = n.x + n.boxWidth, cy = n.y + NODE_H / 2;
        var toggle = el("g", { class: "toggle" });
        var tCircle = el("circle", { cx: cx, cy: cy, r: 8, fill: color, stroke: "#1e2128", "stroke-width": 1.5 });
        var tText = el("text", { x: cx, y: cy + 3.5, "text-anchor": "middle" });
        tText.textContent = n.collapsed ? "+" : "−";
        toggle.appendChild(tCircle);
        toggle.appendChild(tText);
        toggle.addEventListener("click", makeToggleHandler(n));
        g.appendChild(toggle);
      }

      g.addEventListener("click", makeToggleHandler(n));
      nodeLayer.appendChild(g);
    }
  }

  function makeToggleHandler(node) {
    return function (e) {
      e.stopPropagation();
      if (node.children.length === 0) return;
      node.collapsed = !node.collapsed;
      draw();
    };
  }

  // ---------- Pan & zoom ----------

  function contentBounds() {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < currentNodes.length; i++) {
      var n = currentNodes[i];
      minX = Math.min(minX, n.x);
      minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + n.boxWidth + 20);
      maxY = Math.max(maxY, n.y + NODE_H);
    }
    return { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
  }

  function fitToScreen() {
    if (!currentNodes.length) return;
    var b = contentBounds();
    var w = Math.max(1, b.maxX - b.minX);
    var h = Math.max(1, b.maxY - b.minY);
    var rect = canvasPane.getBoundingClientRect();
    var scale = Math.min(rect.width / w, rect.height / h) * 0.92;
    scale = Math.max(0.15, Math.min(scale, 1.6));
    view.scale = scale;
    view.x = (rect.width - w * scale) / 2 - b.minX * scale;
    view.y = (rect.height - h * scale) / 2 - b.minY * scale;
    updateTransform();
  }

  // ---------- Export ----------

  function exportSVG() {
    if (!currentNodes.length) return;
    var b = contentBounds();
    var pad = 20;
    var w = (b.maxX - b.minX) + pad * 2;
    var h = (b.maxY - b.minY) + pad * 2;

    var content = viewport.cloneNode(true);
    content.setAttribute("transform", "translate(" + (pad - b.minX) + "," + (pad - b.minY) + ")");

    var out = el("svg", {
      xmlns: svgNS, width: w, height: h, viewBox: "0 0 " + w + " " + h
    });
    var style = document.createElementNS(svgNS, "style");
    style.textContent =
      ".node text{font:13px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#0d0f13;}" +
      ".node.root text{font-weight:700;font-size:14.5px;}" +
      ".link{fill:none;stroke-width:2;opacity:0.75;}" +
      ".toggle text{font:11px monospace;fill:#fff;}";
    out.appendChild(style);
    out.appendChild(el("rect", { x: 0, y: 0, width: w, height: h, fill: "#1e2128" }));
    out.appendChild(content);

    var svgText = "<?xml version=\"1.0\" standalone=\"no\"?>\n" + new XMLSerializer().serializeToString(out);
    var blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var name = (currentRoot && currentRoot.label ? currentRoot.label : "mindmap")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "mindmap";

    var a = document.createElement("a");
    a.href = url;
    a.download = name + ".svg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    var rect = canvasPane.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var delta = -e.deltaY * 0.0015;
    var newScale = Math.max(0.1, Math.min(3, view.scale * (1 + delta)));
    var cx = (mx - view.x) / view.scale;
    var cy = (my - view.y) / view.scale;
    view.x = mx - cx * newScale;
    view.y = my - cy * newScale;
    view.scale = newScale;
    updateTransform();
  }, { passive: false });

  var panning = false, panStart = null;
  svg.addEventListener("mousedown", function (e) {
    panning = true;
    panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    canvasPane.classList.add("panning");
  });
  window.addEventListener("mousemove", function (e) {
    if (!panning) return;
    view.x = panStart.vx + (e.clientX - panStart.x);
    view.y = panStart.vy + (e.clientY - panStart.y);
    updateTransform();
  });
  window.addEventListener("mouseup", function () {
    panning = false;
    canvasPane.classList.remove("panning");
  });

  fitBtn.addEventListener("click", fitToScreen);
  exportBtn.addEventListener("click", exportSVG);

  // ---------- Wiring ----------

  var debounceTimer = null;
  var firstRenderAfterLoad = true;
  function scheduleRender(fit) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      render();
      if (fit) fitToScreen();
      try { localStorage.setItem(STORAGE_KEY, editor.value); } catch (err) {}
    }, firstRenderAfterLoad ? 0 : 150);
    firstRenderAfterLoad = false;
  }

  editor.addEventListener("input", function () { scheduleRender(false); });
  editor.addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var start = editor.selectionStart, end = editor.selectionEnd;
      editor.value = editor.value.slice(0, start) + "  " + editor.value.slice(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      scheduleRender(false);
    }
  });

  window.addEventListener("resize", function () { fitToScreen(); });

  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (err) {}
  editor.value = saved || DEFAULT_SOURCE;
  render();
  fitToScreen();
})();
</script>
</body>
</html>
