<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eMind3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e2128;
    --panel: #262a33;
    --border: #3a3f4b;
    --text: #d8dce3;
    --muted: #8b93a3;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    color: var(--text); letter-spacing: 0.3px;
  }
  header .spacer { flex: 1; }
  header button {
    background: #333844; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  header button:hover { background: #3d4351; }
  header .hint { font-size: 11.5px; color: var(--muted); }

  main {
    flex: 1; display: flex; min-height: 0;
  }

  #editorPane {
    width: 34%; min-width: 220px; max-width: 70%;
    resize: horizontal; overflow: auto;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
  }
  #editor {
    flex: 1; width: 100%; height: 100%;
    background: var(--panel); color: var(--text);
    border: none; outline: none; resize: none;
    padding: 14px; font: 13px/1.55 "SF Mono", Menlo, Consolas, monospace;
    tab-size: 2;
  }

  #canvasPane { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  #canvasPane.panning { cursor: grabbing; }
  #canvasPane:not(.panning) { cursor: grab; }
  svg#map { width: 100%; height: 100%; display: block; }

  .node rect { stroke-width: 1.2; cursor: pointer; }
  .node text { font: 13px -apple-system, sans-serif; fill: #0d0f13; cursor: pointer; user-select: none; pointer-events: none; }
  .node.root text { font-weight: 700; font-size: 14.5px; }
  .link { fill: none; stroke-width: 2; opacity: 0.75; }
  .toggle circle { cursor: pointer; }
  .toggle text { font: 11px monospace; fill: #fff; pointer-events: none; user-select: none; }

  #emptyState {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>eMind3</h1>
    <span class="hint">markdown bullet list &rarr; mind map</span>
    <div class="spacer"></div>
    <span class="hint">scroll to zoom &middot; drag to pan &middot; click a node to collapse</span>
    <button id="fitBtn">Fit to screen</button>
    <button id="exportBtn">Export SVG</button>
  </header>
  <main>
    <div id="editorPane">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div id="canvasPane">
      <svg id="map">
        <g id="viewport"></g>
      </svg>
      <div id="emptyState">Type a markdown bullet list on the left to see the mind map.</div>
    </div>
  </main>
</div>

<script type="module">
  const STORAGE_KEY = "emind3.source";
  const DEFAULT_SOURCE = `# eMind3
- Getting Started
  - Write a markdown bullet list on the left
  - Nested bullets become child nodes
  - Click any node to collapse or expand it
- Features
  - Live preview as you type
  - Pan and zoom the canvas
  - Single HTML file, no dependencies
- Tips
  - Indent with spaces to create sub-branches
  - Use -, * or + as bullet markers
`;

  const editor = document.getElementById("editor");
  const svg = document.getElementById("map");
  const viewport = document.getElementById("viewport");
  const canvasPane = document.getElementById("canvasPane");
  const emptyState = document.getElementById("emptyState");
  const fitBtn = document.getElementById("fitBtn");
  const exportBtn = document.getElementById("exportBtn");

  // ---------- Markdown -> tree ----------

  function parseMarkdown(source) {
    let titleLine = null;
    const bulletLines = [];

    for (const raw of source.split("\n")) {
      if (raw.trim() === "") continue;
      const indent = raw.match(/^[\t ]*/)[0].replaceAll("\t", "    ").length;
      const trimmed = raw.trim();
      const bulletMatch = trimmed.match(/^[-*+]\s+(.*)$/);
      if (bulletMatch) {
        bulletLines.push({ indent, text: bulletMatch[1].trim() });
      } else if (titleLine === null && bulletLines.length === 0) {
        titleLine = trimmed.replace(/^#+\s*/, "");
      }
    }

    const topLevel = [];
    const virtualTop = { children: topLevel };
    const stack = [{ indent: -1, node: virtualTop }];
    for (const item of bulletLines) {
      const node = { label: item.text, children: [] };
      while (stack.length > 1 && item.indent <= stack.at(-1).indent) stack.pop();
      const parent = stack.at(-1).node;
      node.parent = parent === virtualTop ? null : parent;
      parent.children.push(node);
      stack.push({ indent: item.indent, node });
    }

    if (titleLine) {
      const root = { label: titleLine, children: topLevel, parent: null };
      for (const child of topLevel) child.parent = root;
      return root;
    }
    if (topLevel.length === 1) {
      topLevel[0].parent = null;
      return topLevel[0];
    }
    if (topLevel.length === 0) return null;
    const root = { label: "Mind Map", children: topLevel, parent: null };
    for (const child of topLevel) child.parent = root;
    return root;
  }

  // ---------- Layout ----------

  const FONT = "13px -apple-system, sans-serif";
  const ROOT_FONT = "700 14.5px -apple-system, sans-serif";
  const PAD_X = 14, NODE_H = 30, LEAF_PITCH = 42, COL_GAP = 70, MARGIN = 40;

  const measureCtx = document.createElement("canvas").getContext("2d");
  const textWidth = (text, font) => {
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  };

  function assignDepthAndSize(node, depth, maxWidths) {
    node.depth = depth;
    const font = depth === 0 ? ROOT_FONT : FONT;
    node.boxWidth = textWidth(node.label, font) + PAD_X * 2;
    maxWidths[depth] = Math.max(maxWidths[depth] ?? 0, node.boxWidth);
    if (!node.collapsed) {
      for (const child of node.children) assignDepthAndSize(child, depth + 1, maxWidths);
    }
  }

  function assignX(node, colX) {
    node.x = colX[node.depth];
    if (!node.collapsed) for (const child of node.children) assignX(child, colX);
  }

  function assignY(node, counter) {
    if (node.collapsed || node.children.length === 0) {
      node.yIndex = counter.val++;
      return;
    }
    for (const child of node.children) assignY(child, counter);
    const ys = node.children.map((child) => child.yIndex);
    node.yIndex = (Math.min(...ys) + Math.max(...ys)) / 2;
  }

  function layout(root) {
    const maxWidths = {};
    assignDepthAndSize(root, 0, maxWidths);

    const colX = {};
    let cum = MARGIN;
    const maxDepth = Math.max(...Object.keys(maxWidths).map(Number));
    for (let depth = 0; depth <= maxDepth; depth++) {
      colX[depth] = cum;
      cum += (maxWidths[depth] ?? 0) + COL_GAP;
    }
    assignX(root, colX);
    assignY(root, { val: 0 });

    const allNodes = [];
    const collect = (node) => {
      allNodes.push(node);
      if (!node.collapsed) node.children.forEach(collect);
    };
    collect(root);

    for (const node of allNodes) node.y = MARGIN + node.yIndex * LEAF_PITCH;
    return allNodes;
  }

  // ---------- Rendering ----------

  const PALETTE = [
    "#5b9dff", "#54c98a", "#f0a13c", "#e5678f",
    "#9d7bf0", "#3ec7c7", "#e0c23c", "#f07d5b"
  ];
  const ROOT_COLOR = "#aab2c3";

  function assignBranchIndex(root) {
    root.branchIndex = -1;
    root.children.forEach((child, i) => {
      const branchIndex = i % PALETTE.length;
      const walk = (node) => {
        node.branchIndex = branchIndex;
        node.children.forEach(walk);
      };
      walk(child);
    });
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}) => {
    const e = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attrs)) e.setAttribute(key, value);
    return e;
  };

  const colorFor = (node) => (node.depth === 0 ? ROOT_COLOR : PALETTE[node.branchIndex % PALETTE.length]);
  const pathD = (x0, y0, x1, y1) => {
    const mx = (x0 + x1) / 2;
    return `M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  };

  const view = { x: 0, y: 0, scale: 1 };
  const updateTransform = () => {
    viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.scale})`);
  };

  let currentRoot = null;
  let currentNodes = [];
  let nodeLayer = null;
  let linkLayer = null;
  const nodeEls = new Map(); // node -> { g, rect, text, toggleG, tCircle, tText, x, y, opacity }
  const linkEls = new Map(); // child node -> { path, opacity }

  function buildNodeEl(node) {
    const color = colorFor(node);
    const g = el("g", { class: node.depth === 0 ? "node root" : "node" });
    const rect = el("rect", {
      x: 0, y: 0, width: node.boxWidth, height: NODE_H,
      rx: NODE_H / 2, ry: NODE_H / 2,
      fill: color, stroke: color,
      "fill-opacity": node.depth === 0 ? 0.9 : 0.85
    });
    const text = el("text", { x: node.boxWidth / 2, y: NODE_H / 2 + 4.5, "text-anchor": "middle" });
    text.textContent = node.label;
    g.append(rect, text);

    let toggleG = null, tCircle = null, tText = null;
    if (node.children.length > 0) {
      const cx = node.boxWidth, cy = NODE_H / 2;
      toggleG = el("g", { class: "toggle" });
      tCircle = el("circle", { cx, cy, r: 8, fill: color, stroke: "#1e2128", "stroke-width": 1.5 });
      tText = el("text", { x: cx, y: cy + 3.5, "text-anchor": "middle" });
      tText.textContent = node.collapsed ? "+" : "−";
      toggleG.append(tCircle, tText);
      toggleG.addEventListener("click", makeToggleHandler(node));
      g.append(toggleG);
    }

    g.addEventListener("click", makeToggleHandler(node));
    return { g, rect, text, toggleG, tCircle, tText };
  }

  function render() {
    currentRoot = parseMarkdown(editor.value);
    drawInstant();
  }

  function drawInstant() {
    const root = currentRoot;
    viewport.replaceChildren();
    nodeEls.clear();
    linkEls.clear();

    if (!root) {
      currentNodes = [];
      emptyState.style.display = "flex";
      return;
    }
    emptyState.style.display = "none";

    assignBranchIndex(root);
    currentNodes = layout(root);

    linkLayer = el("g", { class: "links" });
    nodeLayer = el("g", { class: "nodes" });
    viewport.append(linkLayer, nodeLayer);

    for (const node of currentNodes) {
      if (node.parent) {
        const x0 = node.parent.x + node.parent.boxWidth, y0 = node.parent.y + NODE_H / 2;
        const x1 = node.x, y1 = node.y + NODE_H / 2;
        const path = el("path", { class: "link", d: pathD(x0, y0, x1, y1), stroke: colorFor(node) });
        linkLayer.append(path);
        linkEls.set(node, { path, opacity: 1 });
      }

      const built = buildNodeEl(node);
      built.g.setAttribute("transform", `translate(${node.x},${node.y})`);
      nodeLayer.append(built.g);
      nodeEls.set(node, { ...built, x: node.x, y: node.y, opacity: 1 });
    }
  }

  function nearestVisibleAncestor(node, visibleSet) {
    let p = node.parent;
    while (p && !visibleSet.has(p)) p = p.parent;
    return p;
  }

  const ANIM_MS = 300;
  const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2);
  let animSeq = 0;

  function drawAnimated() {
    const root = currentRoot;
    if (!root || !nodeLayer) {
      drawInstant();
      return;
    }

    assignBranchIndex(root);
    const newNodes = layout(root);
    const newNodeSet = new Set(newNodes);

    // Nodes: enter + update
    const moves = [];
    for (const node of newNodes) {
      const entry = nodeEls.get(node);
      if (entry) {
        if (entry.tText) entry.tText.textContent = node.collapsed ? "+" : "−";
        moves.push({ entry, fromX: entry.x, fromY: entry.y, toX: node.x, toY: node.y, fromOp: entry.opacity, toOp: 1, remove: false });
      } else {
        const parentEntry = nodeEls.get(node.parent);
        const startX = parentEntry ? parentEntry.x : node.x;
        const startY = parentEntry ? parentEntry.y : node.y;
        const built = buildNodeEl(node);
        built.g.setAttribute("transform", `translate(${startX},${startY})`);
        built.g.style.opacity = "0";
        nodeLayer.append(built.g);
        const newEntry = { ...built, x: startX, y: startY, opacity: 0 };
        nodeEls.set(node, newEntry);
        moves.push({ entry: newEntry, fromX: startX, fromY: startY, toX: node.x, toY: node.y, fromOp: 0, toOp: 1, remove: false });
      }
    }
    // Nodes: exit
    for (const [node, entry] of [...nodeEls]) {
      if (newNodeSet.has(node)) continue;
      const target = nearestVisibleAncestor(node, newNodeSet);
      const targetEntry = target ? nodeEls.get(target) : null;
      const toX = targetEntry ? targetEntry.x : entry.x;
      const toY = targetEntry ? targetEntry.y : entry.y;
      moves.push({ entry, fromX: entry.x, fromY: entry.y, toX, toY, fromOp: entry.opacity, toOp: 0, remove: true });
    }

    // Links: enter + update + exit (endpoints are re-derived live from node positions each frame)
    const linkMoves = [];
    for (const node of newNodes) {
      if (!node.parent) continue;
      const entry = linkEls.get(node);
      if (entry) {
        linkMoves.push({ node, entry, fromOp: entry.opacity, toOp: 1, remove: false });
      } else {
        const path = el("path", { class: "link", stroke: colorFor(node) });
        linkLayer.append(path);
        const newEntry = { path, opacity: 0 };
        linkEls.set(node, newEntry);
        linkMoves.push({ node, entry: newEntry, fromOp: 0, toOp: 1, remove: false });
      }
    }
    for (const [node, entry] of [...linkEls]) {
      if (newNodeSet.has(node)) continue;
      linkMoves.push({ node, entry, fromOp: entry.opacity, toOp: 0, remove: true });
    }

    currentNodes = newNodes;

    const myToken = ++animSeq;
    const t0 = performance.now();

    function frame(now) {
      if (myToken !== animSeq) return;
      const p = Math.min(1, (now - t0) / ANIM_MS);
      const e = easeInOutCubic(p);

      for (const m of moves) {
        const x = m.fromX + (m.toX - m.fromX) * e;
        const y = m.fromY + (m.toY - m.fromY) * e;
        const op = m.fromOp + (m.toOp - m.fromOp) * e;
        m.entry.x = x; m.entry.y = y; m.entry.opacity = op;
        m.entry.g.setAttribute("transform", `translate(${x},${y})`);
        m.entry.g.style.opacity = String(op);
      }

      for (const lm of linkMoves) {
        const parentEntry = nodeEls.get(lm.node.parent);
        const childEntry = nodeEls.get(lm.node);
        if (parentEntry && childEntry) {
          const x0 = parentEntry.x + lm.node.parent.boxWidth, y0 = parentEntry.y + NODE_H / 2;
          const x1 = childEntry.x, y1 = childEntry.y + NODE_H / 2;
          lm.entry.path.setAttribute("d", pathD(x0, y0, x1, y1));
        }
        const op = lm.fromOp + (lm.toOp - lm.fromOp) * e;
        lm.entry.opacity = op;
        lm.entry.path.style.opacity = String(op);
      }

      if (p < 1) {
        requestAnimationFrame(frame);
        return;
      }

      for (const m of moves) if (m.remove) m.entry.g.remove();
      for (const [node] of [...nodeEls]) if (!newNodeSet.has(node)) nodeEls.delete(node);
      for (const lm of linkMoves) if (lm.remove) { lm.entry.path.remove(); linkEls.delete(lm.node); }
    }
    requestAnimationFrame(frame);
  }

  const makeToggleHandler = (node) => (e) => {
    e.stopPropagation();
    if (node.children.length === 0) return;
    node.collapsed = !node.collapsed;
    drawAnimated();
  };

  // ---------- Pan & zoom ----------

  function contentBounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const node of currentNodes) {
      minX = Math.min(minX, node.x);
      minY = Math.min(minY, node.y);
      maxX = Math.max(maxX, node.x + node.boxWidth + 20);
      maxY = Math.max(maxY, node.y + NODE_H);
    }
    return { minX, minY, maxX, maxY };
  }

  function fitToScreen() {
    if (!currentNodes.length) return;
    const { minX, minY, maxX, maxY } = contentBounds();
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);
    const rect = canvasPane.getBoundingClientRect();
    const scale = Math.min(1.6, Math.max(0.15, Math.min(rect.width / w, rect.height / h) * 0.92));
    view.scale = scale;
    view.x = (rect.width - w * scale) / 2 - minX * scale;
    view.y = (rect.height - h * scale) / 2 - minY * scale;
    updateTransform();
  }

  // ---------- Export ----------

  function exportSVG() {
    if (!currentNodes.length) return;
    const { minX, minY, maxX, maxY } = contentBounds();
    const pad = 20;
    const w = (maxX - minX) + pad * 2;
    const h = (maxY - minY) + pad * 2;

    const content = viewport.cloneNode(true);
    content.setAttribute("transform", `translate(${pad - minX},${pad - minY})`);

    const out = el("svg", { xmlns: svgNS, width: w, height: h, viewBox: `0 0 ${w} ${h}` });
    const style = document.createElementNS(svgNS, "style");
    style.textContent = `
      .node text{font:13px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#0d0f13;}
      .node.root text{font-weight:700;font-size:14.5px;}
      .link{fill:none;stroke-width:2;opacity:0.75;}
      .toggle text{font:11px monospace;fill:#fff;}
    `;
    out.append(style, el("rect", { x: 0, y: 0, width: w, height: h, fill: "#1e2128" }), content);

    const svgText = `<?xml version="1.0" standalone="no"?>\n${new XMLSerializer().serializeToString(out)}`;
    const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const name = (currentRoot?.label ?? "mindmap")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "mindmap";

    const a = document.createElement("a");
    a.href = url;
    a.download = `${name}.svg`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvasPane.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const delta = -e.deltaY * 0.0015;
    const newScale = Math.max(0.1, Math.min(3, view.scale * (1 + delta)));
    const cx = (mx - view.x) / view.scale;
    const cy = (my - view.y) / view.scale;
    view.x = mx - cx * newScale;
    view.y = my - cy * newScale;
    view.scale = newScale;
    updateTransform();
  }, { passive: false });

  let panning = false;
  let panStart = null;
  svg.addEventListener("mousedown", (e) => {
    panning = true;
    panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    canvasPane.classList.add("panning");
  });
  window.addEventListener("mousemove", (e) => {
    if (!panning) return;
    view.x = panStart.vx + (e.clientX - panStart.x);
    view.y = panStart.vy + (e.clientY - panStart.y);
    updateTransform();
  });
  window.addEventListener("mouseup", () => {
    panning = false;
    canvasPane.classList.remove("panning");
  });

  fitBtn.addEventListener("click", fitToScreen);
  exportBtn.addEventListener("click", exportSVG);

  // ---------- Wiring ----------

  let debounceTimer = null;
  let firstRenderAfterLoad = true;
  function scheduleRender(fit) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      render();
      if (fit) fitToScreen();
      try { localStorage.setItem(STORAGE_KEY, editor.value); } catch {}
    }, firstRenderAfterLoad ? 0 : 150);
    firstRenderAfterLoad = false;
  }

  editor.addEventListener("input", () => scheduleRender(false));
  editor.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    e.preventDefault();
    const { selectionStart: start, selectionEnd: end } = editor;
    editor.value = `${editor.value.slice(0, start)}  ${editor.value.slice(end)}`;
    editor.selectionStart = editor.selectionEnd = start + 2;
    scheduleRender(false);
  });

  window.addEventListener("resize", () => fitToScreen());

  let saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch {}
  editor.value = saved ?? DEFAULT_SOURCE;
  render();
  fitToScreen();
</script>
</body>
</html>
