<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eMind3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1e2128;
    --panel: #262a33;
    --border: #3a3f4b;
    --text: #d8dce3;
    --muted: #8b93a3;
    --accent: #5b9dff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    color: var(--text); letter-spacing: 0.3px;
  }
  header .spacer { flex: 1; }
  header button {
    background: #333844; color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  header button:hover { background: #3d4351; }
  header .hint { font-size: 11.5px; color: var(--muted); }

  main {
    flex: 1; display: flex; min-height: 0;
  }

  #editorPane {
    width: 34%; min-width: 220px; max-width: 70%;
    resize: horizontal; overflow: auto;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
  }
  #editor {
    flex: 1; width: 100%; height: 100%;
    background: var(--panel); color: var(--text);
    border: none; outline: none; resize: none;
    padding: 14px; font: 13px/1.55 "SF Mono", Menlo, Consolas, monospace;
    tab-size: 2;
  }

  #canvasPane { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  #canvasPane.panning { cursor: grabbing; }
  #canvasPane:not(.panning) { cursor: grab; }
  svg#map { width: 100%; height: 100%; display: block; }

  .node rect { stroke-width: 1.2; cursor: pointer; }
  .node text { font: 13px -apple-system, sans-serif; fill: #0d0f13; cursor: pointer; user-select: none; pointer-events: none; }
  .node.root text { font-weight: 700; font-size: 14.5px; }
  .link { fill: none; stroke-width: 2; opacity: 0.75; }
  .toggle circle { cursor: pointer; }
  .toggle text { font: 11px monospace; fill: #fff; pointer-events: none; user-select: none; }

  #emptyState {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; pointer-events: none;
  }

  #libraryView { display: none; flex: 1; overflow-y: auto; padding: 22px 26px; }
  main.library-mode #editorPane,
  main.library-mode #canvasPane { display: none; }
  main.library-mode #libraryView { display: block; }

  #libraryGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .doc-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
  }
  .doc-card:hover { border-color: var(--accent); }
  .doc-thumb {
    height: 140px; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .doc-thumb svg { width: 100%; height: 100%; }
  .doc-info { padding: 10px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .doc-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .doc-delete {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; line-height: 1; padding: 3px 6px; border-radius: 4px; flex: none;
  }
  .doc-delete:hover { background: #3d4351; color: #e5678f; }
  .doc-delete.confirming { background: #e5678f; color: #fff; font-size: 11px; padding: 3px 8px; }
  .doc-delete.confirming:hover { background: #d1516f; }
  .doc-card.new-card {
    align-items: center; justify-content: center; border-style: dashed;
    color: var(--muted); font-size: 14px; min-height: 190px;
  }
  .doc-card.new-card:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>eMind3</h1>
    <span class="hint" id="hintText">markdown bullet list &rarr; mind map</span>
    <div class="spacer"></div>
    <span class="hint" id="canvasHint">scroll to zoom &middot; drag to pan &middot; click a node to collapse</span>
    <button id="fitBtn">Fit to screen</button>
    <button id="exportBtn">Export SVG</button>
    <button id="libraryBtn">All Mind Maps</button>
  </header>
  <main id="mainEl">
    <div id="editorPane">
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div id="canvasPane">
      <svg id="map">
        <g id="viewport"></g>
      </svg>
      <div id="emptyState">Type a markdown bullet list on the left to see the mind map.</div>
    </div>
    <div id="libraryView">
      <div id="libraryGrid"></div>
    </div>
  </main>
</div>

<script type="module">
  const DEFAULT_SOURCE = `# 🧠 eMind3
- 🚀 Getting Started
  - Write a **markdown** bullet list on the left
  - *Nested* bullets become child nodes
  - Click any node to collapse or expand it
- ✨ Features
  - **Live preview** as you type
  - Pan and zoom the canvas 🔍
  - Single HTML file, *no dependencies*
- 💡 Tips
  - Indent with spaces to create sub-branches
  - Use **bold**, *italic*, and emoji 🎉 in your bullets
  - [x] Try a task checkbox like this one
  - [] Click it to check it off
`;

  // Falls back to an in-memory store when localStorage is unavailable
  // (private browsing, sandboxed/opaque origins, restrictive browser settings)
  // so the app still works for the current session instead of silently losing data.
  function createSafeStorage() {
    try {
      const probeKey = "__emind3_probe__";
      window.localStorage.setItem(probeKey, "1");
      window.localStorage.removeItem(probeKey);
      return window.localStorage;
    } catch {
      const mem = new Map();
      return {
        getItem: (k) => (mem.has(k) ? mem.get(k) : null),
        setItem: (k, v) => { mem.set(k, String(v)); },
        removeItem: (k) => { mem.delete(k); }
      };
    }
  }
  const storage = createSafeStorage();

  const editor = document.getElementById("editor");
  const svg = document.getElementById("map");
  const viewport = document.getElementById("viewport");
  const canvasPane = document.getElementById("canvasPane");
  const emptyState = document.getElementById("emptyState");
  const fitBtn = document.getElementById("fitBtn");
  const exportBtn = document.getElementById("exportBtn");
  const libraryBtn = document.getElementById("libraryBtn");
  const mainEl = document.getElementById("mainEl");
  const libraryGrid = document.getElementById("libraryGrid");
  const hintText = document.getElementById("hintText");
  const canvasHint = document.getElementById("canvasHint");

  // ---------- Markdown -> tree ----------

  const CHECKBOX_RE = /^\[([ xX]?)\]\s*(.*)$/;

  function parseMarkdown(source) {
    let titleLine = null;
    const bulletLines = [];
    const lines = source.split("\n");

    for (let lineIndex = 0; lineIndex < lines.length; lineIndex++) {
      const raw = lines[lineIndex];
      if (raw.trim() === "") continue;
      const indent = raw.match(/^[\t ]*/)[0].replaceAll("\t", "    ").length;
      const trimmed = raw.trim();
      const bulletMatch = trimmed.match(/^[-*+]\s+(.*)$/);
      if (bulletMatch) {
        bulletLines.push({ indent, text: bulletMatch[1].trim(), lineIndex });
      } else if (titleLine === null && bulletLines.length === 0) {
        titleLine = trimmed.replace(/^#+\s*/, "");
      }
    }

    const topLevel = [];
    const virtualTop = { children: topLevel };
    const stack = [{ indent: -1, node: virtualTop }];
    for (const item of bulletLines) {
      const checkboxMatch = item.text.match(CHECKBOX_RE);
      const node = {
        label: checkboxMatch ? checkboxMatch[2] : item.text,
        children: [],
        sourceLine: item.lineIndex,
        hasCheckbox: !!checkboxMatch,
        checked: checkboxMatch ? checkboxMatch[1].toLowerCase() === "x" : false
      };
      while (stack.length > 1 && item.indent <= stack.at(-1).indent) stack.pop();
      const parent = stack.at(-1).node;
      node.parent = parent === virtualTop ? null : parent;
      parent.children.push(node);
      stack.push({ indent: item.indent, node });
    }

    if (titleLine) {
      const root = { label: titleLine, children: topLevel, parent: null };
      for (const child of topLevel) child.parent = root;
      return root;
    }
    if (topLevel.length === 1) {
      topLevel[0].parent = null;
      return topLevel[0];
    }
    if (topLevel.length === 0) return null;
    const root = { label: "Mind Map", children: topLevel, parent: null };
    for (const child of topLevel) child.parent = root;
    return root;
  }

  // ---------- Inline markdown (bold / italic) ----------

  const INLINE_RE = /\*\*\*(.+?)\*\*\*|\*\*(.+?)\*\*|\*(.+?)\*/g;

  function parseInline(text) {
    const segments = [];
    let last = 0, m;
    INLINE_RE.lastIndex = 0;
    while ((m = INLINE_RE.exec(text))) {
      if (m.index > last) segments.push({ text: text.slice(last, m.index) });
      if (m[1] !== undefined) segments.push({ text: m[1], bold: true, italic: true });
      else if (m[2] !== undefined) segments.push({ text: m[2], bold: true });
      else segments.push({ text: m[3], italic: true });
      last = INLINE_RE.lastIndex;
    }
    if (last < text.length) segments.push({ text: text.slice(last) });
    if (segments.length === 0) segments.push({ text: "" });
    return segments;
  }

  // ---------- Layout ----------

  const FONT_FAMILY = "-apple-system, sans-serif";
  const NODE_FONT_SIZE = 13;
  const ROOT_FONT_SIZE = 14.5;
  const PAD_X = 14, NODE_H = 30, LEAF_PITCH = 42, COL_GAP = 70, MARGIN = 40;
  const CHECKBOX_SIZE = 14, CHECKBOX_GAP = 6;

  const segmentFont = (depth, seg) => {
    const size = depth === 0 ? ROOT_FONT_SIZE : NODE_FONT_SIZE;
    const weight = depth === 0 || seg.bold ? 700 : 400;
    const style = seg.italic ? "italic" : "normal";
    return `${style} ${weight} ${size}px ${FONT_FAMILY}`;
  };

  const measureCtx = document.createElement("canvas").getContext("2d");
  const textWidth = (text, font) => {
    measureCtx.font = font;
    return measureCtx.measureText(text).width;
  };

  function assignDepthAndSize(node, depth, maxWidths) {
    node.depth = depth;
    node.segments = parseInline(node.label);
    const labelWidth = node.segments.reduce((sum, seg) => sum + textWidth(seg.text, segmentFont(depth, seg)), 0);
    const checkboxWidth = node.hasCheckbox ? CHECKBOX_SIZE + CHECKBOX_GAP : 0;
    node.boxWidth = labelWidth + checkboxWidth + PAD_X * 2;
    maxWidths[depth] = Math.max(maxWidths[depth] ?? 0, node.boxWidth);
    if (!node.collapsed) {
      for (const child of node.children) assignDepthAndSize(child, depth + 1, maxWidths);
    }
  }

  function assignX(node, colX) {
    node.x = colX[node.depth];
    if (!node.collapsed) for (const child of node.children) assignX(child, colX);
  }

  function assignY(node, counter) {
    if (node.collapsed || node.children.length === 0) {
      node.yIndex = counter.val++;
      return;
    }
    for (const child of node.children) assignY(child, counter);
    const ys = node.children.map((child) => child.yIndex);
    node.yIndex = (Math.min(...ys) + Math.max(...ys)) / 2;
  }

  function layout(root) {
    const maxWidths = {};
    assignDepthAndSize(root, 0, maxWidths);

    const colX = {};
    let cum = MARGIN;
    const maxDepth = Math.max(...Object.keys(maxWidths).map(Number));
    for (let depth = 0; depth <= maxDepth; depth++) {
      colX[depth] = cum;
      cum += (maxWidths[depth] ?? 0) + COL_GAP;
    }
    assignX(root, colX);
    assignY(root, { val: 0 });

    const allNodes = [];
    const collect = (node) => {
      allNodes.push(node);
      if (!node.collapsed) node.children.forEach(collect);
    };
    collect(root);

    for (const node of allNodes) node.y = MARGIN + node.yIndex * LEAF_PITCH;
    return allNodes;
  }

  // ---------- Rendering ----------

  const PALETTE = [
    "#5b9dff", "#54c98a", "#f0a13c", "#e5678f",
    "#9d7bf0", "#3ec7c7", "#e0c23c", "#f07d5b"
  ];
  const ROOT_COLOR = "#aab2c3";

  function assignBranchIndex(root) {
    root.branchIndex = -1;
    root.children.forEach((child, i) => {
      const branchIndex = i % PALETTE.length;
      const walk = (node) => {
        node.branchIndex = branchIndex;
        node.children.forEach(walk);
      };
      walk(child);
    });
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}) => {
    const e = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attrs)) e.setAttribute(key, value);
    return e;
  };

  const colorFor = (node) => (node.depth === 0 ? ROOT_COLOR : PALETTE[node.branchIndex % PALETTE.length]);
  const pathD = (x0, y0, x1, y1) => {
    const mx = (x0 + x1) / 2;
    return `M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  };

  const checkboxY = () => (NODE_H - CHECKBOX_SIZE) / 2;
  const checkmarkD = (x, y) => `M${x + 3},${y + 7.5} L${x + 6},${y + 10.5} L${x + 11},${y + 3.5}`;

  function appendCheckbox(container, node) {
    const y = checkboxY();
    const rect = el("rect", {
      x: PAD_X, y, width: CHECKBOX_SIZE, height: CHECKBOX_SIZE, rx: 3, ry: 3,
      fill: node.checked ? "#1e2128" : "none",
      stroke: "#1e2128", "stroke-width": 1.5,
      "pointer-events": "all"
    });
    container.append(rect);
    let mark = null;
    if (node.checked) {
      mark = el("path", {
        d: checkmarkD(PAD_X, y), fill: "none", stroke: "#fff",
        "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round",
        "pointer-events": "none"
      });
      container.append(mark);
    }
    return { rect, mark };
  }

  const view = { x: 0, y: 0, scale: 1 };
  const updateTransform = () => {
    viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.scale})`);
  };

  let currentRoot = null;
  let currentNodes = [];
  let nodeLayer = null;
  let linkLayer = null;
  const nodeEls = new Map(); // node -> { g, rect, text, toggleG, tCircle, tText, x, y, opacity }
  const linkEls = new Map(); // child node -> { path, opacity }

  function buildNodeEl(node) {
    const color = colorFor(node);
    const g = el("g", { class: node.depth === 0 ? "node root" : "node" });
    const rect = el("rect", {
      x: 0, y: 0, width: node.boxWidth, height: NODE_H,
      rx: NODE_H / 2, ry: NODE_H / 2,
      fill: color, stroke: color,
      "fill-opacity": node.depth === 0 ? 0.9 : 0.85
    });
    g.append(rect);

    let checkboxRect = null, checkboxMark = null;
    if (node.hasCheckbox) {
      const built = appendCheckbox(g, node);
      checkboxRect = built.rect;
      checkboxMark = built.mark;
      checkboxRect.addEventListener("click", makeCheckboxHandler(node));
    }

    const textX = node.hasCheckbox ? PAD_X + CHECKBOX_SIZE + CHECKBOX_GAP : node.boxWidth / 2;
    const text = el("text", {
      x: textX, y: NODE_H / 2 + 4.5,
      "text-anchor": node.hasCheckbox ? "start" : "middle"
    });
    for (const seg of node.segments) {
      const tspan = document.createElementNS(svgNS, "tspan");
      if (seg.bold) tspan.setAttribute("font-weight", "700");
      if (seg.italic) tspan.setAttribute("font-style", "italic");
      tspan.textContent = seg.text;
      text.append(tspan);
    }
    g.append(text);

    let toggleG = null, tCircle = null, tText = null;
    if (node.children.length > 0) {
      const cx = node.boxWidth, cy = NODE_H / 2;
      toggleG = el("g", { class: "toggle" });
      tCircle = el("circle", { cx, cy, r: 8, fill: color, stroke: "#1e2128", "stroke-width": 1.5 });
      tText = el("text", { x: cx, y: cy + 3.5, "text-anchor": "middle" });
      tText.textContent = node.collapsed ? "+" : "−";
      toggleG.append(tCircle, tText);
      toggleG.addEventListener("click", makeToggleHandler(node));
      g.append(toggleG);
    }

    g.addEventListener("click", makeToggleHandler(node));
    return { g, rect, text, toggleG, tCircle, tText, checkboxRect, checkboxMark };
  }

  function render() {
    currentRoot = parseMarkdown(editor.value);
    drawInstant();
  }

  function drawInstant() {
    const root = currentRoot;
    viewport.replaceChildren();
    nodeEls.clear();
    linkEls.clear();

    if (!root) {
      currentNodes = [];
      emptyState.style.display = "flex";
      return;
    }
    emptyState.style.display = "none";

    assignBranchIndex(root);
    currentNodes = layout(root);

    linkLayer = el("g", { class: "links" });
    nodeLayer = el("g", { class: "nodes" });
    viewport.append(linkLayer, nodeLayer);

    for (const node of currentNodes) {
      if (node.parent) {
        const x0 = node.parent.x + node.parent.boxWidth, y0 = node.parent.y + NODE_H / 2;
        const x1 = node.x, y1 = node.y + NODE_H / 2;
        const path = el("path", { class: "link", d: pathD(x0, y0, x1, y1), stroke: colorFor(node) });
        linkLayer.append(path);
        linkEls.set(node, { path, opacity: 1 });
      }

      const built = buildNodeEl(node);
      built.g.setAttribute("transform", `translate(${node.x},${node.y})`);
      nodeLayer.append(built.g);
      nodeEls.set(node, { ...built, x: node.x, y: node.y, opacity: 1 });
    }
  }

  function nearestVisibleAncestor(node, visibleSet) {
    let p = node.parent;
    while (p && !visibleSet.has(p)) p = p.parent;
    return p;
  }

  const ANIM_MS = 300;
  const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2);
  let animSeq = 0;

  function drawAnimated() {
    const root = currentRoot;
    if (!root || !nodeLayer) {
      drawInstant();
      return;
    }

    assignBranchIndex(root);
    const newNodes = layout(root);
    const newNodeSet = new Set(newNodes);

    // Nodes: enter + update
    const moves = [];
    for (const node of newNodes) {
      const entry = nodeEls.get(node);
      if (entry) {
        if (entry.tText) entry.tText.textContent = node.collapsed ? "+" : "−";
        moves.push({ entry, fromX: entry.x, fromY: entry.y, toX: node.x, toY: node.y, fromOp: entry.opacity, toOp: 1, remove: false });
      } else {
        const parentEntry = nodeEls.get(node.parent);
        const startX = parentEntry ? parentEntry.x : node.x;
        const startY = parentEntry ? parentEntry.y : node.y;
        const built = buildNodeEl(node);
        built.g.setAttribute("transform", `translate(${startX},${startY})`);
        built.g.style.opacity = "0";
        nodeLayer.append(built.g);
        const newEntry = { ...built, x: startX, y: startY, opacity: 0 };
        nodeEls.set(node, newEntry);
        moves.push({ entry: newEntry, fromX: startX, fromY: startY, toX: node.x, toY: node.y, fromOp: 0, toOp: 1, remove: false });
      }
    }
    // Nodes: exit
    for (const [node, entry] of [...nodeEls]) {
      if (newNodeSet.has(node)) continue;
      const target = nearestVisibleAncestor(node, newNodeSet);
      const targetEntry = target ? nodeEls.get(target) : null;
      const toX = targetEntry ? targetEntry.x : entry.x;
      const toY = targetEntry ? targetEntry.y : entry.y;
      moves.push({ entry, fromX: entry.x, fromY: entry.y, toX, toY, fromOp: entry.opacity, toOp: 0, remove: true });
    }

    // Links: enter + update + exit (endpoints are re-derived live from node positions each frame)
    const linkMoves = [];
    for (const node of newNodes) {
      if (!node.parent) continue;
      const entry = linkEls.get(node);
      if (entry) {
        linkMoves.push({ node, entry, fromOp: entry.opacity, toOp: 1, remove: false });
      } else {
        const path = el("path", { class: "link", stroke: colorFor(node) });
        linkLayer.append(path);
        const newEntry = { path, opacity: 0 };
        linkEls.set(node, newEntry);
        linkMoves.push({ node, entry: newEntry, fromOp: 0, toOp: 1, remove: false });
      }
    }
    for (const [node, entry] of [...linkEls]) {
      if (newNodeSet.has(node)) continue;
      linkMoves.push({ node, entry, fromOp: entry.opacity, toOp: 0, remove: true });
    }

    currentNodes = newNodes;

    const myToken = ++animSeq;
    const t0 = performance.now();

    function frame(now) {
      if (myToken !== animSeq) return;
      const p = Math.min(1, (now - t0) / ANIM_MS);
      const e = easeInOutCubic(p);

      for (const m of moves) {
        const x = m.fromX + (m.toX - m.fromX) * e;
        const y = m.fromY + (m.toY - m.fromY) * e;
        const op = m.fromOp + (m.toOp - m.fromOp) * e;
        m.entry.x = x; m.entry.y = y; m.entry.opacity = op;
        m.entry.g.setAttribute("transform", `translate(${x},${y})`);
        m.entry.g.style.opacity = String(op);
      }

      for (const lm of linkMoves) {
        const parentEntry = nodeEls.get(lm.node.parent);
        const childEntry = nodeEls.get(lm.node);
        if (parentEntry && childEntry) {
          const x0 = parentEntry.x + lm.node.parent.boxWidth, y0 = parentEntry.y + NODE_H / 2;
          const x1 = childEntry.x, y1 = childEntry.y + NODE_H / 2;
          lm.entry.path.setAttribute("d", pathD(x0, y0, x1, y1));
        }
        const op = lm.fromOp + (lm.toOp - lm.fromOp) * e;
        lm.entry.opacity = op;
        lm.entry.path.style.opacity = String(op);
      }

      if (p < 1) {
        requestAnimationFrame(frame);
        return;
      }

      for (const m of moves) if (m.remove) m.entry.g.remove();
      for (const [node] of [...nodeEls]) if (!newNodeSet.has(node)) nodeEls.delete(node);
      for (const lm of linkMoves) if (lm.remove) { lm.entry.path.remove(); linkEls.delete(lm.node); }
    }
    requestAnimationFrame(frame);
  }

  const makeToggleHandler = (node) => (e) => {
    e.stopPropagation();
    if (node.children.length === 0) return;
    node.collapsed = !node.collapsed;
    drawAnimated();
  };

  function updateCheckboxVisual(node) {
    const entry = nodeEls.get(node);
    if (!entry || !entry.checkboxRect) return;
    entry.checkboxRect.setAttribute("fill", node.checked ? "#1e2128" : "none");
    if (entry.checkboxMark) {
      entry.checkboxMark.remove();
      entry.checkboxMark = null;
    }
    if (node.checked) {
      entry.checkboxMark = el("path", {
        d: checkmarkD(PAD_X, checkboxY()), fill: "none", stroke: "#fff",
        "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round",
        "pointer-events": "none"
      });
      entry.checkboxRect.after(entry.checkboxMark);
    }
  }

  const makeCheckboxHandler = (node) => (e) => {
    e.stopPropagation();
    if (node.sourceLine == null) return;
    const lines = editor.value.split("\n");
    const line = lines[node.sourceLine];
    const m = line.match(/^(\s*[-*+]\s+)\[([ xX]?)\](.*)$/);
    if (!m) return;
    node.checked = !node.checked;
    lines[node.sourceLine] = `${m[1]}[${node.checked ? "x" : ""}]${m[3]}`;
    editor.value = lines.join("\n");
    updateCheckboxVisual(node);
    persistActiveDoc();
  };

  // ---------- Pan & zoom ----------

  function contentBounds(nodes) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const node of nodes) {
      minX = Math.min(minX, node.x);
      minY = Math.min(minY, node.y);
      maxX = Math.max(maxX, node.x + node.boxWidth + 20);
      maxY = Math.max(maxY, node.y + NODE_H);
    }
    return { minX, minY, maxX, maxY };
  }

  function fitToScreen() {
    if (!currentNodes.length) return;
    const { minX, minY, maxX, maxY } = contentBounds(currentNodes);
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);
    const rect = canvasPane.getBoundingClientRect();
    const scale = Math.min(1.6, Math.max(0.15, Math.min(rect.width / w, rect.height / h) * 0.92));
    view.scale = scale;
    view.x = (rect.width - w * scale) / 2 - minX * scale;
    view.y = (rect.height - h * scale) / 2 - minY * scale;
    updateTransform();
  }

  // ---------- Export ----------

  function exportSVG() {
    if (!currentNodes.length) return;
    const { minX, minY, maxX, maxY } = contentBounds(currentNodes);
    const pad = 20;
    const w = (maxX - minX) + pad * 2;
    const h = (maxY - minY) + pad * 2;

    const content = viewport.cloneNode(true);
    content.setAttribute("transform", `translate(${pad - minX},${pad - minY})`);

    const out = el("svg", { xmlns: svgNS, width: w, height: h, viewBox: `0 0 ${w} ${h}` });
    const style = document.createElementNS(svgNS, "style");
    style.textContent = `
      .node text{font:13px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#0d0f13;}
      .node.root text{font-weight:700;font-size:14.5px;}
      .link{fill:none;stroke-width:2;opacity:0.75;}
      .toggle text{font:11px monospace;fill:#fff;}
    `;
    out.append(style, el("rect", { x: 0, y: 0, width: w, height: h, fill: "#1e2128" }), content);

    const svgText = `<?xml version="1.0" standalone="no"?>\n${new XMLSerializer().serializeToString(out)}`;
    const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const name = (currentRoot?.label ?? "mindmap")
      .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "mindmap";

    const a = document.createElement("a");
    a.href = url;
    a.download = `${name}.svg`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvasPane.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const delta = -e.deltaY * 0.0015;
    const newScale = Math.max(0.1, Math.min(3, view.scale * (1 + delta)));
    const cx = (mx - view.x) / view.scale;
    const cy = (my - view.y) / view.scale;
    view.x = mx - cx * newScale;
    view.y = my - cy * newScale;
    view.scale = newScale;
    updateTransform();
  }, { passive: false });

  let panning = false;
  let panStart = null;
  svg.addEventListener("mousedown", (e) => {
    panning = true;
    panStart = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    canvasPane.classList.add("panning");
  });
  window.addEventListener("mousemove", (e) => {
    if (!panning) return;
    view.x = panStart.vx + (e.clientX - panStart.x);
    view.y = panStart.vy + (e.clientY - panStart.y);
    updateTransform();
  });
  window.addEventListener("mouseup", () => {
    panning = false;
    canvasPane.classList.remove("panning");
  });

  fitBtn.addEventListener("click", fitToScreen);
  exportBtn.addEventListener("click", exportSVG);

  // ---------- Documents ----------

  const LEGACY_KEY = "emind3.source";
  const DOCS_INDEX_KEY = "emind3.docs";
  const ACTIVE_ID_KEY = "emind3.activeId";
  const docContentKey = (id) => `emind3.doc.${id}`;

  const newDocId = () =>
    (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);

  function loadDocsIndex() {
    const raw = storage.getItem(DOCS_INDEX_KEY);
    if (!raw) return [];
    try { return JSON.parse(raw); } catch { return []; }
  }
  function saveDocsIndex(list) {
    storage.setItem(DOCS_INDEX_KEY, JSON.stringify(list));
  }
  function loadDocContent(id) {
    return storage.getItem(docContentKey(id));
  }
  function saveDocContent(id, content) {
    storage.setItem(docContentKey(id), content);
  }
  function deleteDocContent(id) {
    storage.removeItem(docContentKey(id));
  }

  function plainTitle(root) {
    const plain = root?.label ? parseInline(root.label).map((s) => s.text).join("") : "";
    return plain.trim() || "Untitled";
  }

  function migrateLegacyIfNeeded() {
    const docs = loadDocsIndex();
    if (docs.length > 0) return docs;
    const legacy = storage.getItem(LEGACY_KEY);
    const id = newDocId();
    const content = legacy ?? DEFAULT_SOURCE;
    saveDocContent(id, content);
    const list = [{ id, title: plainTitle(parseMarkdown(content)), updatedAt: Date.now() }];
    saveDocsIndex(list);
    storage.removeItem(LEGACY_KEY);
    return list;
  }

  function persistActiveDoc() {
    if (!activeDocId) return;
    saveDocContent(activeDocId, editor.value);
    const docs = loadDocsIndex();
    const idx = docs.findIndex((d) => d.id === activeDocId);
    const entry = { id: activeDocId, title: plainTitle(currentRoot), updatedAt: Date.now() };
    if (idx >= 0) docs[idx] = entry; else docs.push(entry);
    saveDocsIndex(docs);
  }

  function flushActiveDoc() {
    if (debounceTimer) {
      clearTimeout(debounceTimer);
      debounceTimer = null;
      render();
    }
    persistActiveDoc();
  }

  function openDoc(id) {
    activeDocId = id;
    storage.setItem(ACTIVE_ID_KEY, id);
    editor.value = loadDocContent(id) ?? DEFAULT_SOURCE;
    render();
    fitToScreen();
  }

  function createNewDoc() {
    const id = newDocId();
    saveDocContent(id, DEFAULT_SOURCE);
    const docs = loadDocsIndex();
    docs.push({ id, title: plainTitle(parseMarkdown(DEFAULT_SOURCE)), updatedAt: Date.now() });
    saveDocsIndex(docs);
    return id;
  }

  function deleteDoc(id) {
    deleteDocContent(id);
    const docs = loadDocsIndex().filter((d) => d.id !== id);
    saveDocsIndex(docs);
    return docs;
  }

  // ---------- Library (all mind maps grid) ----------

  let activeDocId = null;
  let libraryMode = false;

  function buildThumbnailSVG(source) {
    const root = parseMarkdown(source);
    if (!root) return null;
    assignBranchIndex(root);
    const nodes = layout(root);
    const { minX, minY, maxX, maxY } = contentBounds(nodes);
    const pad = 16;
    const w = (maxX - minX) + pad * 2;
    const h = (maxY - minY) + pad * 2;

    const svgEl = el("svg", { viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "xMidYMid meet" });
    const g = el("g", { transform: `translate(${pad - minX},${pad - minY})` });
    svgEl.append(g);

    for (const node of nodes) {
      if (!node.parent) continue;
      const x0 = node.parent.x + node.parent.boxWidth, y0 = node.parent.y + NODE_H / 2;
      const x1 = node.x, y1 = node.y + NODE_H / 2;
      g.append(el("path", {
        d: pathD(x0, y0, x1, y1), fill: "none", stroke: colorFor(node),
        "stroke-width": 2, opacity: 0.75
      }));
    }
    for (const node of nodes) {
      const color = colorFor(node);
      const nodeG = el("g", { transform: `translate(${node.x},${node.y})` });
      nodeG.append(el("rect", {
        x: 0, y: 0, width: node.boxWidth, height: NODE_H, rx: NODE_H / 2, ry: NODE_H / 2,
        fill: color, "fill-opacity": node.depth === 0 ? 0.9 : 0.85
      }));
      if (node.hasCheckbox) appendCheckbox(nodeG, node);
      const textX = node.hasCheckbox ? PAD_X + CHECKBOX_SIZE + CHECKBOX_GAP : node.boxWidth / 2;
      const text = el("text", {
        x: textX, y: NODE_H / 2 + 4.5, "text-anchor": node.hasCheckbox ? "start" : "middle",
        fill: "#0d0f13", "font-family": FONT_FAMILY,
        "font-size": node.depth === 0 ? ROOT_FONT_SIZE : NODE_FONT_SIZE
      });
      for (const seg of node.segments) {
        const tspan = document.createElementNS(svgNS, "tspan");
        if (seg.bold) tspan.setAttribute("font-weight", "700");
        if (seg.italic) tspan.setAttribute("font-style", "italic");
        tspan.textContent = seg.text;
        text.append(tspan);
      }
      nodeG.append(text);
      g.append(nodeG);
    }
    return svgEl;
  }

  function formatRelativeTime(ts) {
    const diff = Date.now() - ts;
    const min = 60000, hour = 3600000, day = 86400000;
    if (diff < min) return "just now";
    if (diff < hour) return `${Math.floor(diff / min)}m ago`;
    if (diff < day) return `${Math.floor(diff / hour)}h ago`;
    if (diff < day * 7) return `${Math.floor(diff / day)}d ago`;
    return new Date(ts).toLocaleDateString();
  }

  function handleDeleteDoc(id) {
    let docs = deleteDoc(id);
    if (docs.length === 0) {
      openDoc(createNewDoc());
    } else if (id === activeDocId) {
      openDoc(docs[0].id);
    }
    renderLibrary();
  }

  function renderLibrary() {
    const docs = loadDocsIndex().slice().sort((a, b) => b.updatedAt - a.updatedAt);
    libraryGrid.replaceChildren();

    const newCardEl = document.createElement("div");
    newCardEl.className = "doc-card new-card";
    newCardEl.textContent = "+ New Mind Map";
    newCardEl.addEventListener("click", () => {
      openDoc(createNewDoc());
      setLibraryMode(false);
    });
    libraryGrid.append(newCardEl);

    for (const doc of docs) {
      const card = document.createElement("div");
      card.className = "doc-card";

      const thumb = document.createElement("div");
      thumb.className = "doc-thumb";
      const content = loadDocContent(doc.id) ?? "";
      const thumbSvg = buildThumbnailSVG(content);
      if (thumbSvg) thumb.append(thumbSvg);
      else thumb.textContent = "Empty";
      card.append(thumb);

      const info = document.createElement("div");
      info.className = "doc-info";

      const textWrap = document.createElement("div");
      const titleEl = document.createElement("div");
      titleEl.className = "doc-title";
      titleEl.textContent = doc.title || "Untitled";
      const metaEl = document.createElement("div");
      metaEl.className = "doc-meta";
      metaEl.textContent = formatRelativeTime(doc.updatedAt);
      textWrap.append(titleEl, metaEl);

      const delBtn = document.createElement("button");
      delBtn.className = "doc-delete";
      delBtn.textContent = "✕";
      delBtn.title = "Delete";
      let confirmingDelete = false;
      let confirmTimer = null;
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!confirmingDelete) {
          confirmingDelete = true;
          delBtn.textContent = "Delete?";
          delBtn.classList.add("confirming");
          confirmTimer = setTimeout(() => {
            confirmingDelete = false;
            delBtn.textContent = "✕";
            delBtn.classList.remove("confirming");
          }, 2500);
          return;
        }
        clearTimeout(confirmTimer);
        handleDeleteDoc(doc.id);
      });

      info.append(textWrap, delBtn);
      card.append(info);

      card.addEventListener("click", () => {
        openDoc(doc.id);
        setLibraryMode(false);
      });

      libraryGrid.append(card);
    }
  }

  function setLibraryMode(active) {
    libraryMode = active;
    mainEl.classList.toggle("library-mode", active);
    fitBtn.style.display = active ? "none" : "";
    exportBtn.style.display = active ? "none" : "";
    canvasHint.style.display = active ? "none" : "";
    libraryBtn.textContent = active ? "← Back to Map" : "All Mind Maps";
    hintText.textContent = active
      ? "your mind maps, stored locally in this browser"
      : "markdown bullet list → mind map";
    if (active) renderLibrary();
    else fitToScreen();
  }

  libraryBtn.addEventListener("click", () => {
    if (libraryMode) {
      setLibraryMode(false);
    } else {
      flushActiveDoc();
      setLibraryMode(true);
    }
  });

  // ---------- Wiring ----------

  let debounceTimer = null;
  let firstRenderAfterLoad = true;
  function scheduleRender(fit) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      render();
      if (fit) fitToScreen();
      persistActiveDoc();
    }, firstRenderAfterLoad ? 0 : 150);
    firstRenderAfterLoad = false;
  }

  editor.addEventListener("input", () => scheduleRender(false));
  editor.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    e.preventDefault();
    const { selectionStart: start, selectionEnd: end } = editor;
    editor.value = `${editor.value.slice(0, start)}  ${editor.value.slice(end)}`;
    editor.selectionStart = editor.selectionEnd = start + 2;
    scheduleRender(false);
  });

  window.addEventListener("resize", () => { if (!libraryMode) fitToScreen(); });

  const initialDocs = migrateLegacyIfNeeded();
  let initialActiveId = storage.getItem(ACTIVE_ID_KEY);
  if (!initialActiveId || !initialDocs.some((d) => d.id === initialActiveId)) {
    initialActiveId = initialDocs[0].id;
  }
  openDoc(initialActiveId);
</script>
</body>
</html>
