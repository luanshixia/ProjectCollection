<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Earth Globe</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #e8f0ff;
    z-index: 10;
    user-select: none;
    pointer-events: none;
  }
  #ui h1 {
    margin: 0 0 4px 0;
    font-size: 18px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  #ui p {
    margin: 0;
    font-size: 12px;
    opacity: 0.75;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  #controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  #controls button {
    background: rgba(20, 30, 50, 0.65);
    border: 1px solid rgba(255,255,255,0.15);
    color: #e8f0ff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.15s ease;
  }
  #controls button:hover {
    background: rgba(40, 60, 100, 0.8);
  }
  #controls button.active {
    background: rgba(70, 130, 220, 0.85);
    border-color: rgba(150, 190, 255, 0.6);
  }

  #loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cfe0ff;
    font-size: 14px;
    background: #000;
    z-index: 20;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div id="loading">Loading globe…</div>
<div id="canvas-container"></div>

<div id="ui">
  <h1>Earth</h1>
  <p>Drag to rotate &bull; Scroll or pinch to zoom</p>
</div>

<div id="controls">
  <button id="btn-rotate">Pause Auto-Spin</button>
  <button id="btn-reset">Reset View</button>
  <button id="btn-clouds" class="active">Clouds: On</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Real Earth imagery (NASA Blue Marble derivatives), hotlinked from
  // three.js's own MIT-licensed examples repo. Only the twinkling star
  // sprite below is procedurally drawn.
  // ---------------------------------------------------------------------

  const TEXTURE_BASE =
    "https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/";

  function createStarTexture() {
    const size = 64;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.4, "rgba(255,255,255,0.6)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    return canvas;
  }

  // ---------------------------------------------------------------------
  // Scene setup
  // ---------------------------------------------------------------------

  const container = document.getElementById("canvas-container");

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 0, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x556677, 0.7);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
  sunLight.position.set(5, 3, 5);
  scene.add(sunLight);

  // Starfield background
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 3000;
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const radius = 60 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    starPositions[i * 3 + 2] = radius * Math.cos(phi);
  }
  starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));

  const starTexture = new THREE.CanvasTexture(createStarTexture());
  const starMaterial = new THREE.PointsMaterial({
    size: 1.6,
    map: starTexture,
    transparent: true,
    depthWrite: false,
    sizeAttenuation: true,
  });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Loading manager: tracks the real-imagery downloads (color, normal,
  // specular, and cloud maps) and hides the overlay once they've all
  // arrived, or reports a network problem if one fails.
  const loadingEl = document.getElementById("loading");
  const loadingManager = new THREE.LoadingManager();
  loadingManager.onLoad = function () {
    if (loadingEl) loadingEl.style.display = "none";
  };
  loadingManager.onError = function () {
    if (loadingEl) {
      loadingEl.textContent = "Couldn't load Earth imagery — check your internet connection and reload.";
    }
  };
  const textureLoader = new THREE.TextureLoader(loadingManager);

  // Earth: real NASA Blue Marble color, normal, and specular (ocean mask) maps
  const earthRadius = 2;
  const earthTexture = textureLoader.load(TEXTURE_BASE + "earth_atmos_2048.jpg");
  earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  earthTexture.encoding = THREE.sRGBEncoding;

  const earthNormalTexture = textureLoader.load(TEXTURE_BASE + "earth_normal_2048.jpg");
  const earthSpecularTexture = textureLoader.load(TEXTURE_BASE + "earth_specular_2048.jpg");

  const earthGeometry = new THREE.SphereGeometry(earthRadius, 96, 96);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture,
    normalMap: earthNormalTexture,
    normalScale: new THREE.Vector2(0.85, 0.85),
    specularMap: earthSpecularTexture,
    specular: new THREE.Color(0x222222),
    shininess: 30,
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  // Cloud layer: real satellite cloud cover map
  const cloudTexture = textureLoader.load(TEXTURE_BASE + "earth_clouds_1024.png");
  cloudTexture.encoding = THREE.sRGBEncoding;
  const cloudGeometry = new THREE.SphereGeometry(earthRadius * 1.01, 96, 96);
  const cloudMaterial = new THREE.MeshLambertMaterial({
    map: cloudTexture,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
  });
  const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
  scene.add(clouds);

  // Atmosphere glow (simple additive backside sphere)
  const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.06, 64, 64);
  const atmosphereMaterial = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vNormal;
      void main() {
        float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
        gl_FragColor = vec4(0.35, 0.6, 1.0, 1.0) * intensity;
      }
    `,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
  });
  const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
  scene.add(atmosphere);

  // ---------------------------------------------------------------------
  // Controls: free rotation via drag, zoom via scroll/pinch
  // ---------------------------------------------------------------------

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 3.2;
  controls.maxDistance = 20;
  controls.enablePan = false;
  controls.rotateSpeed = 0.6;
  controls.zoomSpeed = 0.8;

  let autoRotate = true;
  let cloudsVisible = true;
  const autoRotateSpeed = 0.15; // radians per second

  // ---------------------------------------------------------------------
  // UI wiring
  // ---------------------------------------------------------------------

  const btnRotate = document.getElementById("btn-rotate");
  const btnReset = document.getElementById("btn-reset");
  const btnClouds = document.getElementById("btn-clouds");

  btnRotate.classList.add("active");

  btnRotate.addEventListener("click", function () {
    autoRotate = !autoRotate;
    btnRotate.textContent = autoRotate ? "Pause Auto-Spin" : "Resume Auto-Spin";
    btnRotate.classList.toggle("active", autoRotate);
  });

  btnReset.addEventListener("click", function () {
    controls.reset();
    camera.position.set(0, 0, 8);
    earth.rotation.set(0, 0, 0);
    clouds.rotation.set(0, 0, 0);
  });

  btnClouds.addEventListener("click", function () {
    cloudsVisible = !cloudsVisible;
    clouds.visible = cloudsVisible;
    btnClouds.textContent = "Clouds: " + (cloudsVisible ? "On" : "Off");
    btnClouds.classList.toggle("active", cloudsVisible);
  });

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------------------------------------------------------------
  // Animation loop
  // ---------------------------------------------------------------------

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (autoRotate) {
      earth.rotation.y += autoRotateSpeed * delta;
      clouds.rotation.y += autoRotateSpeed * delta;
    }
    clouds.rotation.y += 0.01 * delta;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
})();
</script>

</body>
</html>
